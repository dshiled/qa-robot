name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Security, store, browser and e2e suites
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      # node:sqlite requires Node 22+, which package.json also declares via
      # engines.node. Pinned explicitly so CI never drifts from that.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fast, no browser needed. Catches the injection regressions.
      - name: Unit suites (security + store)
        run: npm test

      - name: CLI injection test
        run: npm run test:cli

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # playwright.config.ts starts the server itself via webServer, so no
      # manual startup step is needed for the e2e suite.
      - name: End-to-end suite
        run: npx playwright test --project=chromium

      # The dashboard key-gate suite talks to a live server, so start one in
      # the background first and wait for it to answer before running.
      - name: Start server for the key-gate suite
        run: |
          node server.js > server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health > /dev/null; then
              echo "server ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "server did not become ready"
          cat server.log
          exit 1

      - name: Dashboard key-gate suite
        run: npm run test:ui

      - name: Server log (if the run above failed)
        if: failure()
        run: cat server.log || true

      - name: Upload playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
